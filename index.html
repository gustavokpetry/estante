<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#4A2E1B" />
    <meta name="description" content="Sua biblioteca pessoal de PDFs, lidos como livros." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Estante</title>
    <script>
      // Aplica o tema antes de desenhar a página, para não piscar.
      try {
        var t = localStorage.getItem('estante:tema')
        if (t === 'claro' || t === 'escuro') document.documentElement.dataset.tema = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
